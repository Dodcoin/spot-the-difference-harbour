<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Lights — Spot the Difference</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23ffd76a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">HARBOUR LIGHTS <span>· spot the difference</span></div>
    <div id="scene-name" class="scene-name">Scene 1 of 3 — Dusk Harbour</div>
    <div class="timer-wrap">
      <span id="timer" class="timer">2:30</span>
      <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>
    </div>
    <div id="remaining" class="remaining">5 of 5 left</div>
    <div id="score" class="score">Score 0</div>
    <button id="hint-btn" class="hint-btn">Hint (-50)</button>
  </header>
  <main id="panels">
    <figure class="panel">
      <figcaption>LEFT — the original</figcaption>
      <canvas id="panel-left" width="560" height="420"></canvas>
    </figure>
    <div class="divider">VS</div>
    <figure class="panel">
      <figcaption>RIGHT — spot what changed</figcaption>
      <canvas id="panel-right" width="560" height="420"></canvas>
    </figure>
  </main>
  <footer id="message-bar">
    <span id="message">Find every difference before the clock runs out.</span>
    <span class="help">Click a difference · Arrow keys move · Enter marks · Tab switches panel · H hints</span>
  </footer>
  <div id="overlay" class="overlay hidden">
    <div id="overlay-card" class="overlay-card"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
